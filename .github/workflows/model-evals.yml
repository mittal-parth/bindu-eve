name: Model evals

# Manual only. The job runs when the person who clicked Run is the repository
# owner. The Anthropic key is a secret on the model-evals environment, which
# only that owner can approve, and only for workflow runs from main. Leave the
# branch dropdown on main and pass pr or ref to test other code.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test. Leave empty to use ref, or the selected branch.
        required: false
        type: string
      ref:
        description: Branch, tag, or commit to test. Leave the branch dropdown on main.
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  model:
    name: Model evals
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: model-evals
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Choose the code to test
        id: target
        env:
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$PR" ] && [ -n "$REF" ]; then
            echo "Pass a pull request number or a ref, not both."
            exit 1
          fi
          if [ -n "$PR" ]; then
            case "$PR" in
              *[!0-9]*)
                echo "Pull request number must be digits."
                exit 1
                ;;
            esac
            echo "ref=refs/pull/${PR}/head" >> "$GITHUB_OUTPUT"
          elif [ -n "$REF" ]; then
            case "$REF" in
              *[!A-Za-z0-9_./-]* | -* | *..*)
                echo "Ref must be a branch, tag, or commit."
                exit 1
                ;;
            esac
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check Anthropic key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Add ANTHROPIC_API_KEY as a secret on the model-evals environment."
            exit 1
          fi

      - name: Run model evals
        run: npm run eval -- --tag model --strict --junit .eve/junit.xml

      - name: Upload eval results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            .eve/junit.xml
            .eve/evals/
          if-no-files-found: ignore
